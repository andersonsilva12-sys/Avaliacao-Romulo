<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array no Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white">
  <main class="bg-gray-100 p-6 flex flex-col items-center gap-4 h-screen">
    <h1 class="text-xl">Array no Canvas</h1>

    <form id="form-valor" class="flex items-center gap-2">
      <input id="input-valor" type="number" required placeholder="Valor" class="border px-2 py-1">
      <button type="submit" class="border px-3 py-1 bg-white">Confirmar</button>
      <button id="botao-ordenar" type="button" class="border px-3 py-1 bg-white">Ordenar</button>
    </form>

    <p id="mensagem" class="text-sm h-5"></p>

    <canvas id="canvas" width="800" height="260" class="bg-white"></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
